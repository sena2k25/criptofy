services:
  - type: web
    name: criptofy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXUSPAG_BASE_URL
        value: https://nexuspag.com
      - key: NEXUSPAG_API_KEY
        sync: false
      - key: NEXUSPAG_WEBHOOK_URL
        sync: false
